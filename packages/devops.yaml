---
# DevOps automation configuration
# Handles automatic updates and configuration deployment

shell_command:
  git_pull: "GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no' git -C /config pull origin main"

automation:
  - id: auto_deploy_config
    alias: "Deploy Configuration Updates"
    description: "Automatically deploy configuration changes when GitHub Actions validation passes"

    trigger:
      # Triggered by webhook from GitHub Actions after successful validation
      - platform: webhook
        webhook_id: deploy_config
        allowed_methods:
          - POST
        local_only: false

    action:
      - service: notify.all_devices
        data:
          title: "Home Assistant Deployment Starting"
          message: >-
            Commit {{ trigger.json.commit[:7] }}: {{ trigger.json.message }}

      # Start git pull addon, which is configured to pull latest changes and restart if needed.
      - service: hassio.addon_start
        data:
          addon: core_git_pull

      

  - id: automatic_updates
    alias: "Automatic Updates"
    description: "Automatically install available updates daily at 10 PM"

    triggers:
      - trigger: time
        at: "22:00:00"

    actions:
      - action: update.install
        target:
          entity_id: >-
            {{ states.update | map(attribute='entity_id') |
               select('is_state', 'on') | list }}
