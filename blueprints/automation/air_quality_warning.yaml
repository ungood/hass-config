---
blueprint:
  name: Air Quality Warning
  description: >
    Notifies when air quality is bad and won't resolve within the specified time.
    Alerts immediately if AQI is worsening, or if the current improvement rate
    won't bring AQI to acceptable levels in time.
  domain: automation
  input:
    floor_name:
      name: Floor Name
      description: Name of the floor (for notification messages)
      selector:
        text:
      default: Floor

    aqi_sensor:
      name: AQI Sensor
      description: Sensor that reports AQI level
      selector:
        entity:
          domain: sensor

    aqi_trend_sensor:
      name: AQI Trend Sensor
      description: Statistics sensor tracking AQI rate of change per second
      selector:
        entity:
          domain: sensor

    bad_aqi_threshold:
      name: Bad AQI Threshold
      description: AQI level considered bad
      selector:
        number:
          min: 10
          max: 500
      default: 50

    target_aqi:
      name: Target AQI
      description: AQI level considered acceptable
      selector:
        number:
          min: 0
          max: 100
      default: 30

    resolve_time:
      name: Resolution Time (minutes)
      description: Max time to wait for AQI to resolve before alerting
      selector:
        number:
          min: 1
          max: 60
      default: 15

mode: single
max_exceeded: silent

variables:
  floor_name: !input floor_name
  aqi_sensor: !input aqi_sensor
  aqi_trend_sensor: !input aqi_trend_sensor
  bad_aqi_threshold: !input bad_aqi_threshold
  target_aqi: !input target_aqi
  resolve_time: !input resolve_time
  current_aqi: "{{ states(aqi_sensor) | float(0) }}"
  trend: "{{ states(aqi_trend_sensor) | float(0) }}"
  # Calculate minutes to resolve (if improving)
  # trend is change per second, so multiply by 60 for per-minute
  minutes_to_resolve: >
    {% if trend >= 0 %}
      999
    {% else %}
      {{ ((current_aqi - target_aqi) / (trend | abs * 60)) | round(1) }}
    {% endif %}
  is_worsening: "{{ trend >= 0 }}"
  wont_resolve_in_time: "{{ minutes_to_resolve > resolve_time }}"

triggers:
  - trigger: numeric_state
    entity_id: !input aqi_sensor
    above: !input bad_aqi_threshold
    for:
      minutes: 1

conditions:
  - condition: template
    value_template: "{{ is_worsening or wont_resolve_in_time }}"

actions:
  - service: notify.all_devices
    data:
      title: "{{ floor_name }} Air Quality Warning"
      message: >
        {% if is_worsening %}
        AQI is {{ current_aqi | int }} and getting worse.
        {% else %}
        AQI is {{ current_aqi | int }} and won't reach acceptable levels for ~{{ minutes_to_resolve | int }} minutes.
        {% endif %}
