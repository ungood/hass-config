---
blueprint:
  name: High CO2 Warning
  description: >
    Notifies when CO2 levels are high and require manual intervention (opening windows).
    Alerts immediately if CO2 is rising, or if the current improvement rate
    won't bring CO2 to acceptable levels in time.
  domain: automation
  input:
    floor_name:
      name: Floor Name
      description: Name of the floor (for notification messages)
      selector:
        text:
      default: Floor

    co2_sensor:
      name: CO2 Sensor
      description: Sensor that reports CO2 level in ppm
      selector:
        entity:
          domain: sensor

    co2_trend_sensor:
      name: CO2 Trend Sensor
      description: Statistics sensor tracking CO2 rate of change per second
      selector:
        entity:
          domain: sensor

    high_co2_threshold:
      name: High CO2 Threshold
      description: CO2 level (ppm) considered high and requiring action
      selector:
        number:
          min: 400
          max: 5000
      default: 1000

    target_co2:
      name: Target CO2
      description: CO2 level (ppm) considered acceptable
      selector:
        number:
          min: 400
          max: 1500
      default: 800

    resolve_time:
      name: Resolution Time (minutes)
      description: Max time to wait for CO2 to resolve before alerting
      selector:
        number:
          min: 1
          max: 60
      default: 15

mode: single
max_exceeded: silent

variables:
  floor_name: !input floor_name
  co2_sensor: !input co2_sensor
  co2_trend_sensor: !input co2_trend_sensor
  high_co2_threshold: !input high_co2_threshold
  target_co2: !input target_co2
  resolve_time: !input resolve_time
  current_co2: "{{ states(co2_sensor) | float(0) }}"
  trend: "{{ states(co2_trend_sensor) | float(0) }}"
  # Calculate minutes to resolve (if improving)
  # trend is change per second, so multiply by 60 for per-minute
  minutes_to_resolve: >
    {% if trend >= 0 %}
      999
    {% else %}
      {{ ((current_co2 - target_co2) / (trend | abs * 60)) | round(1) }}
    {% endif %}
  is_worsening: "{{ trend >= 0 }}"
  wont_resolve_in_time: "{{ minutes_to_resolve > resolve_time }}"

triggers:
  - trigger: numeric_state
    entity_id: !input co2_sensor
    above: !input high_co2_threshold
    for:
      minutes: 1

conditions:
  - condition: template
    value_template: "{{ is_worsening or wont_resolve_in_time }}"

actions:
  - service: notify.all_devices
    data:
      title: "{{ floor_name }} High CO2 Warning"
      message: >
        {% if is_worsening %}
        CO2 is {{ current_co2 | int }} ppm and rising. Open a window!
        {% else %}
        CO2 is {{ current_co2 | int }} ppm and won't reach acceptable levels for ~{{ minutes_to_resolve | int }} minutes. Consider opening a window.
        {% endif %}
